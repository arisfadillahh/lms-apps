<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#22367b">
    <title>Koneksi terputus - Clevio LMS</title>
    <style>
      :root {
        color-scheme: light;
        --navy: #22367b;
        --navy-deep: #17285f;
        --ink: #18294f;
        --muted: #617292;
        --line: #dbe5f1;
        --surface: #ffffff;
        --green: #9bd52e;
        --cyan: #00a9d0;
        --page: #f4f8fc;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        min-height: 100vh;
        background: var(--page);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .offline-shell {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        padding: 28px clamp(20px, 5vw, 72px) 24px;
      }

      .brand {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        gap: 14px;
        color: var(--navy);
        text-decoration: none;
      }

      .brand img { display: block; width: 148px; height: auto; }

      .brand-copy {
        display: flex;
        flex-direction: column;
        gap: 3px;
        border-left: 1px solid var(--line);
        padding-left: 14px;
      }

      .brand-copy strong { font-size: 14px; letter-spacing: .01em; }
      .brand-copy span { color: var(--muted); font-size: 11px; }

      .offline-main {
        display: grid;
        width: min(100%, 980px);
        flex: 1;
        place-items: center;
        align-self: center;
        padding: 56px 0;
      }

      .offline-panel {
        width: min(100%, 560px);
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 22px 55px rgba(34, 54, 123, .12);
        padding: clamp(28px, 6vw, 52px);
        text-align: center;
      }

      .status-icon {
        display: grid;
        width: 68px;
        height: 68px;
        place-items: center;
        margin: 0 auto 24px;
        border: 1px solid #b9e6ef;
        border-radius: 20px;
        background: #eaf8fb;
        color: var(--cyan);
      }

      .status-icon svg { width: 32px; height: 32px; }
      .eyebrow {
        margin: 0 0 10px;
        color: var(--cyan);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .14em;
      }

      h1 {
        margin: 0;
        color: var(--navy);
        font-size: clamp(30px, 5vw, 46px);
        line-height: 1.08;
        letter-spacing: -.03em;
      }

      .description {
        max-width: 420px;
        margin: 18px auto 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.65;
      }

      .connection-note {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin: 26px auto 0;
        color: var(--ink);
        font-size: 13px;
        font-weight: 650;
      }

      .connection-note i {
        display: block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 5px #eff8dc;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 30px;
      }

      button, .home-link {
        min-height: 46px;
        border-radius: 10px;
        padding: 0 20px;
        font: inherit;
        font-size: 13px;
        font-weight: 750;
        text-decoration: none;
        cursor: pointer;
      }

      button {
        border: 1px solid var(--navy);
        background: var(--navy);
        color: #fff;
        box-shadow: 0 7px 15px rgba(34, 54, 123, .18);
      }

      .home-link {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        color: var(--navy);
        background: #fff;
      }

      button:focus-visible, .home-link:focus-visible { outline: 3px solid #9be4f0; outline-offset: 3px; }
      .footer { color: #7d8ca8; font-size: 11px; text-align: center; }

      @media (max-width: 520px) {
        .offline-shell { padding: 20px 16px 18px; }
        .brand-copy { display: none; }
        .brand img { width: 138px; }
        .offline-main { padding: 36px 0; }
        .offline-panel { padding: 30px 22px; }
        .actions { flex-direction: column; }
        button, .home-link { width: 100%; justify-content: center; }
      }

      @media (prefers-reduced-motion: reduce) {
        button, .home-link { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="offline-shell">
      <header>
        <a class="brand" href="/" aria-label="Clevio LMS">
          <img src="/logo/innovator-camp-logo-dark.png" alt="Clevio Innovator Camp">
          <span class="brand-copy">
            <strong>Clevio LMS</strong>
            <span>Learning workspace</span>
          </span>
        </a>
      </header>

      <main class="offline-main">
        <section class="offline-panel" aria-labelledby="offline-title">
          <div class="status-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 1l22 22" />
              <path d="M16.7 16.7A7.8 7.8 0 0 1 12 18.3a7.8 7.8 0 0 1-6.2-3.1" />
              <path d="M3.7 8.7A12 12 0 0 1 12 5.7c1.8 0 3.5.4 5 1.1" />
              <path d="M8.7 13.7A4.3 4.3 0 0 1 12 12.2c.8 0 1.6.2 2.3.6" />
              <path d="M12 21h.01" />
            </svg>
          </div>
          <p class="eyebrow">KONEKSI TERPUTUS</p>
          <h1 id="offline-title">LMS siap dipakai lagi saat kamu online.</h1>
          <p class="description">Kami belum bisa menghubungkan halaman ini ke Clevio. Periksa koneksi internet, lalu coba buka kembali.</p>
          <p class="connection-note"><i></i> Data dan aktivitasmu tetap aman.</p>
          <div class="actions">
            <button type="button" onclick="window.location.reload()">Coba lagi</button>
            <a class="home-link" href="/">Ke halaman utama</a>
          </div>
        </section>
      </main>

      <footer class="footer">Clevio Innovator Camp &middot; Clevio LMS</footer>
    </div>
  </body>
</html>
